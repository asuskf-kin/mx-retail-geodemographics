    "nbformat==5.10.4",
    "numpy==2.5.1",
    "openpyxl==3.1.5",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "pymupdf==1.28.0",
    "pyogrio==0.13.0",
    "pypdf==6.16.2",
    "pyproj==3.8.0",
    "python-pptx==1.0.2",
    "requests==2.34.2",
    "scikit-learn==1.9.0",
    "scipy==1.18.1",
    "shapely==2.1.2",
